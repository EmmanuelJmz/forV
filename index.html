<body>
    <div class="center-block">
        <span class="front">
          <p class="timeRefDays label center-block">Emma ❤️ Val</p>
        </span>
        <span class="back">
          <p id="days" class="big-number center-block">0</p< /span>
      
            <span class="front">

      <!--   <p id="hours">00</p> -->

      <!--   <p id="minutes">00</p> -->

      <!--   <p class="timeRefSeconds">seconds</p> -->
      </div>

      <script>

window.onload = function () {
  upTime("august,08,2026,00:00:00");
};
function upTime(countTo) {
  now = new Date();
  countTo = new Date(countTo);
  difference = now - countTo;

  days = Math.floor((difference / (60 * 60 * 1000 * 24)) * 1);
  hours = Math.floor(
    ((difference % (60 * 60 * 1000 * 24)) / (60 * 60 * 1000)) * 1
  );
  mins = Math.floor(
    (((difference % (60 * 60 * 1000 * 24)) % (60 * 60 * 1000)) / (60 * 1000)) *
      1
  );
  secs = Math.floor(
    ((((difference % (60 * 60 * 1000 * 24)) % (60 * 60 * 1000)) % (60 * 1000)) /
      1000) *
      1
  );

  document.getElementById("days").firstChild.nodeValue = days;
  document.getElementById("hours").firstChild.nodeValue = hours;
  document.getElementById("minutes").firstChild.nodeValue = mins;
  document.getElementById("seconds").firstChild.nodeValue = secs;

  clearTimeout(upTime.to);
  upTime.to = setTimeout(function () {
    upTime(countTo);
  }, 1000);
}

      </script>
</body>
